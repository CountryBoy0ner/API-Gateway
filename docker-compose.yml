services:
  # ================= AUTH SERVICE =================
  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: super_secret_password
    ports:
      - "5433:5432"    # внешний порт для дебага, можно убрать
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./Authentication-Service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      - auth-db
    environment:
      # используются в application.properties auth-сервиса
      DB_URL: jdbc:postgresql://auth-db:5432/auth_service
      DB_USERNAME: auth_user
      DB_PASSWORD: super_secret_password
      JWT_SECRET: super_long_random_secret_key_at_least_32_chars
    ports:
      - "8082:8082"

  # ================= USER SERVICE =================
  user-db:
    image: postgres:16-alpine
    container_name: user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-redis:
    image: redis:7-alpine
    container_name: user-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - user-redis-data:/data

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: unless-stopped
    depends_on:
      - user-db
      - user-redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_DATA_REDIS_HOST: user-redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080         # внутри контейнера
    ports:
      - "8081:8080"              # снаружи будешь ходить на 8081

  # ================= ORDER SERVICE =================
  order-db:
    image: postgres:16-alpine
    container_name: order-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  order-service:
    build:
      context: ./Order-Service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    depends_on:
      - order-db
      - user-service
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orders
      DB_USERNAME: postgres
      DB_PASSWORD: 123
      # важно: внутри docker-а order-service должен ходить к user-service по имени контейнера
      USER_SERVICE_BASE_URL: http://user-service:8080/api/users
    ports:
      - "8083:8083"

  # ================= API GATEWAY =================
  api-gateway:
    build:
      context: ./com.Innowise
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - order-service
    environment:
      # адреса сервисов ВНУТРИ docker-сети
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8080
      ORDER_SERVICE_URL: http://order-service:8083
      # тот же секрет, что и в Auth-Service
      JWT_SECRET: super_long_random_secret_key_at_least_32_chars
    ports:
      - "8085:8084"  # ← было "8084:8084"

volumes:
  auth-db-data:
  user-db-data:
  user-redis-data:
  order-db-data:
