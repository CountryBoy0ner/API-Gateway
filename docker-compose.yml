version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: "8084"

      AUTH_URL: "http://auth-service:8082"
      USER_URL: "http://user-service:8080"
      ORDER_URL: "http://order-service:8083"

      JWT_SECRET: "super_long_random_secret_key_at_least_32_chars"
    ports:
      - "8084:8084"
    networks:
      - innowise-micro-net

networks:
  innowise-micro-net:
    external: true
